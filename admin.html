<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMS · Ar Rahmah Malaysia</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{background:#F3F1EC}
  .login{min-height:calc(100vh - 30px);display:grid;place-items:center;padding:24px 16px}
  .login .box{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);padding:28px;border-radius:var(--r)}
  .login img{height:64px;margin:0 auto 12px}
  .demo{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;font-size:.85rem}
  .demo table{width:100%;border-collapse:collapse}
  .demo td{padding:6px 0;border-bottom:1px solid var(--line)}
  .demo td:last-child{text-align:right}
  .login-err{display:none;color:var(--err);font-size:.9rem;margin:0}
  .login-err.show{display:block}

  .app{display:none;grid-template-columns:240px 1fr;min-height:calc(100vh - 30px)}
  .app.on{display:grid}
  .side{background:var(--navy);color:#C9D3E3;padding:16px 0;display:flex;flex-direction:column}
  .side .logo{display:flex;align-items:center;gap:10px;padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px;color:#fff;font:600 1rem var(--serif);text-decoration:none}
  .side .logo img{height:40px}
  .side a.m{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;font-size:.93rem;color:#C9D3E3;text-decoration:none}
  .side a.m:hover{background:rgba(255,255,255,.06);color:#fff}
  .side a.m[aria-current]{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
  .badge{background:var(--gold);color:var(--navy);font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:2px}
  .main{min-width:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 32px;background:#fff;border-bottom:1px solid var(--line);font-size:.9rem;flex-wrap:wrap}
  .top .who b{color:var(--navy)}
  .top .links{display:flex;gap:16px;align-items:center}
  .content{padding:28px 32px 80px;max-width:1100px}
  .content h1{font-size:1.8rem;margin-bottom:4px}
  .sub{color:var(--muted);margin-bottom:24px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:#fff;margin-bottom:24px}
  .kpis a{padding:18px;border-right:1px solid var(--line);text-decoration:none;color:inherit}
  .kpis a:last-child{border-right:0}
  .kpis a:hover{background:#FBFAF6}
  .kpis b{font:600 1.8rem var(--serif);color:var(--navy);display:block}
  .kpis span{font-size:.85rem;color:var(--muted)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:24px}
  .panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h h2{font-size:1.15rem;margin:0}
  .panel-b{padding:18px}
  .panel .tbl{border:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pill{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:2px;background:#EEF1F6;color:var(--navy-2);white-space:nowrap}
  .pill.ok{background:#E5F2EA;color:var(--ok)}
  .pill.draft{background:#F6EED6;color:var(--gold-ink)}
  .pill.new{background:#FBE9E7;color:var(--err)}
  .link{all:unset;cursor:pointer;color:var(--navy);font-weight:600;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
  .link:focus-visible{outline:3px solid var(--gold)}
  .link.del{color:var(--err)}
  .acts{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
  .tbl.edit td{padding:8px}
  .tbl.edit input,.tbl.edit select{min-width:110px}
  .tbl td small{color:var(--muted)}
  .bar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters button{all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--line-2);border-radius:var(--r);font-size:.85rem}
  .filters button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .img-field{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .img-field img{width:180px;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);background:#F4F0E6}
  .help{font-size:.83rem;color:var(--muted);margin:4px 0 0;font-weight:400}
  .log{list-style:none;margin:0;padding:0}
  .log li{padding:10px 18px;border-bottom:1px solid var(--line);font-size:.9rem;display:flex;justify-content:space-between;gap:12px}
  .log li:last-child{border-bottom:0}
  .log time{color:var(--muted);white-space:nowrap;font-size:.8rem}
  .msg{background:#F7F5EF;padding:10px 12px;border-radius:var(--r);font-size:.9rem;margin-top:6px;white-space:pre-wrap}
  .lock{background:#F6EED6;color:var(--gold-ink);padding:10px 14px;border-radius:var(--r);font-size:.9rem;margin-bottom:16px}
  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
    .side{flex-direction:row;overflow-x:auto;padding:0;position:sticky;top:0;z-index:5;align-self:start}
    .side .logo{display:none}
    .side a.m{white-space:nowrap;padding:14px}
    .side a.m[aria-current]{box-shadow:inset 0 -3px 0 var(--gold)}
    .top{padding:10px 16px}
    .content{padding:20px 16px 80px}
    .kpis{grid-template-columns:1fr 1fr}
    .kpis a:nth-child(2){border-right:0}
    .kpis a:nth-child(-n+2){border-bottom:1px solid var(--line)}
    .grid2{grid-template-columns:1fr}
    .hide-sm{display:none}
  }
</style>
</head>
<body data-admin>
<div class="mock-bar"><b>DRAF MOCKUP</b> · CMS statik: data disimpan dalam pelayar ini (localStorage). Sistem sebenar guna pangkalan data.</div>

<div class="login" id="login">
  <form class="box form" id="loginForm" novalidate>
    <img src="assets/logo.png" alt="Ar Rahmah Malaysia">
    <h1 style="font-size:1.5rem;text-align:center;margin-bottom:0">Log masuk admin</h1>
    <div><label for="u">Emel</label><input id="u" type="email" autocomplete="username"></div>
    <div><label for="p">Kata laluan</label><input id="p" type="password" autocomplete="current-password"></div>
    <p class="login-err" id="loginErr" role="alert">Emel atau kata laluan salah.</p>
    <button class="btn btn-navy" type="submit">Masuk</button>
    <div class="demo">
      <b>Akaun demo</b>
      <table id="demoUsers"></table>
    </div>
  </form>
</div>

<div class="app" id="app">
  <nav class="side" id="side" aria-label="Menu admin"></nav>
  <div class="main">
    <div class="top">
      <span class="who" id="who"></span>
      <span class="links"><a href="index.html" target="_blank" rel="noopener">Lihat laman awam</a><button class="link" id="logout" type="button">Keluar</button></span>
    </div>
    <div class="content" id="main" tabindex="-1"></div>
  </div>
</div>

<div class="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="cms.js"></script>
<script src="site.js"></script>
<script src="admin.js"></script>
</body>
</html>
